<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="A focused Kanban board for small projects."><meta name="theme-color" content="#101419"><title>Flowboard</title><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="stylesheet" href="./styles.css"><script type="module" src="./app.js"></script></head>
<body><header><div class="brand"><img src="./icon.svg" alt="">Flowboard</div><span class="badge">A little more organized</span></header><main>
<section class="intro"><p class="eyebrow">Make room for focus</p><h1>Big ideas.<br>Small next steps.</h1><p>Give every task a place, then move it forward.</p></section>
<form id="task-form" class="panel form"><label>Task name<input name="title" placeholder="What needs to happen?" required maxlength="100"></label><label>Priority<select name="priority"><option value="normal">Normal</option><option value="high">High</option><option value="low">Low</option></select></label><button class="primary" type="submit" id="save-task">+ Add task</button><button type="button" id="cancel-edit" hidden>Cancel edit</button></form>
<div class="toolbar"><label class="field">Search tasks<input id="search" type="search" placeholder="Find your next step"></label><label class="field">Filter priority<select id="filter"><option value="all">All priorities</option><option value="high">High</option><option value="normal">Normal</option><option value="low">Low</option></select></label><button id="demo" class="small">Load sample board</button><button id="undo" class="small" hidden>Undo delete</button></div>
<div class="row"><p id="summary" class="muted"></p></div><section id="board" class="board" aria-label="Task board"></section><p id="notice" class="notice" role="status" aria-live="polite"></p><footer class="footer">Made for everyday progress. Data stays in this browser. No account needed.</footer></main></body></html>
